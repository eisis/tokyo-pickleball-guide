name: Find new courts

# 毎週土曜の自動チェックは Claude の予定タスク「新コート候補の週次チェック」に移行（記事の中身まで読んで判定する）。
# このワークフローは予備として、手動実行ボタンだけ残している。
on:
  workflow_dispatch: {} # 手動実行ボタン

permissions:
  contents: read
  issues: write

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/find-new-courts.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
